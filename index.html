<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFAF3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="灵感星盒">
<title>灵感星盒 · 想到就去做</title>
<style>
/* ============================================================
   灵感星盒 · 主题
   色卡：春天樱粉 #F0ADCE / 阳光黄 #F6E281 / 青柠 #C8DC7D / 天空蓝 #6CC8F1
   ============================================================ */
:root{
  --pink:#F0ADCE;
  --pinkMid:#E888B4;
  --pinkDeep:#C9598B;
  --pinkSoft:#FCE7F1;
  --pinkMist:#FDF3F8;
  --rose:#7E3B5B;
  --yellow:#F6E281;
  --yellowSoft:#FDF7DB;
  --yellowDeep:#B08A1E;
  --blue:#6CC8F1;
  --blueSoft:#E8F7FD;
  --blueDeep:#2E7FA6;
  --green:#C8DC7D;
  --greenSoft:#F3F8DF;
  --greenDeep:#6E8524;
  --cream:#FFFAF3;
  --paper:#FFFFFF;
  --ink:#4C3B45;
  --ink2:#6E5A66;
  --sub:#A08B98;
  --line:#F7E4EE;
  --line2:#EFE9DC;
  --shadow:0 10px 24px -14px rgba(201,89,139,.45), 0 2px 6px rgba(201,89,139,.06);
  --shadow-lg:0 22px 48px -20px rgba(201,89,139,.42);
  --r:22px;
  --r-sm:14px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  background:
    radial-gradient(120% 60% at 8% -6%, #FFF0F6 0%, rgba(255,240,246,0) 60%),
    radial-gradient(90% 50% at 100% 4%, #FFF7DA 0%, rgba(255,247,218,0) 58%),
    radial-gradient(120% 60% at 50% 108%, #EAF6FD 0%, rgba(234,246,253,0) 62%),
    var(--cream);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
/* 纸面细纹理 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(#F6DCE8 .8px, transparent .8px);
  background-size:22px 22px;
  mask-image:linear-gradient(#000 0%, rgba(0,0,0,.25) 55%, transparent 100%);
}
#app{position:relative;z-index:1;max-width:660px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
svg.ic{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
svg.ic.fill{fill:currentColor;stroke:none}

/* ---------------- 顶栏 ---------------- */
.hd{
  position:sticky;top:0;z-index:30;
  padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:flex-start;gap:10px;
  background:linear-gradient(180deg, rgba(255,250,243,.96), rgba(255,250,243,.78) 70%, rgba(255,250,243,0));
  backdrop-filter:blur(10px);
}
.hd .brand{flex:1;min-width:0}
.hd h1{
  font-size:20px;font-weight:800;letter-spacing:.06em;color:var(--rose);
  display:flex;align-items:center;gap:7px;
}
.hd h1 .spark{color:var(--pinkMid);width:18px;height:18px}
.hd .sub{font-size:11.5px;color:var(--sub);letter-spacing:.14em;margin-top:2px}
.icobtn{
  width:38px;height:38px;border-radius:13px;border:1px solid var(--line);
  background:#fff;color:var(--pinkDeep);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 10px -6px rgba(201,89,139,.4);transition:.15s;
}
.icobtn:active{transform:scale(.93)}

/* ---------------- 内容容器 ---------------- */
main{flex:1;padding:2px 16px calc(112px + env(safe-area-inset-bottom))}
.sec{display:flex;align-items:center;gap:8px;margin:22px 4px 10px}
.sec .bar{width:4px;height:14px;border-radius:3px;background:linear-gradient(180deg,var(--pink),var(--pinkMid))}
.sec h2{font-size:13.5px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.sec .more{margin-left:auto;font-size:11.5px;color:var(--sub);cursor:pointer}

/* ---------------- 卡片 ---------------- */
.card{
  background:var(--paper);border-radius:var(--r);padding:16px;
  border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:12px;position:relative;
}
.card.soft{background:linear-gradient(180deg,#fff, #FFF9FC)}
.card.warm{background:linear-gradient(160deg,#FFFDF3,#FFF3F8);border-color:#FBEBD3}
/* 波浪花边（贴纸感） */
.scallop-b{
  position:relative;
}
.scallop-b::after{
  content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;
  background:radial-gradient(circle at 7px 0, var(--paper) 7px, transparent 7.5px) repeat-x;
  background-size:14px 8px;opacity:.9;pointer-events:none;
}

/* ---------------- 标签 / 徽章 ---------------- */
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:9px;letter-spacing:.04em;white-space:nowrap;
}
.tag.idea{background:var(--pinkSoft);color:var(--pinkDeep)}
.tag.todo{background:var(--greenSoft);color:var(--greenDeep)}
.tag.goal{background:var(--blueSoft);color:var(--blueDeep)}
.tag.plain{background:#FBF4F8;color:var(--sub);font-weight:600}
.tag.sun{background:var(--yellowSoft);color:var(--yellowDeep)}
.tag.urg0{background:#F8F4F6;color:#B7A7B2}
.tag.urg1{background:var(--yellowSoft);color:var(--yellowDeep)}
.tag.urg2{background:#FDE9EE;color:#C4456B}
.tag.tagx{background:#FBF1F7;color:var(--pinkDeep);font-weight:600}

/* ---------------- 按钮 ---------------- */
.btn{
  border:none;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:700;
  font-family:var(--font);cursor:pointer;transition:.16s;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;letter-spacing:.02em;
}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#F7BED8,var(--pink));color:var(--rose);
  box-shadow:0 10px 20px -12px rgba(224,120,168,.9)}
.btn.sun{background:linear-gradient(135deg,#FBEDA9,var(--yellow));color:#6F5710;
  box-shadow:0 10px 20px -12px rgba(214,180,60,.9)}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--pink)}
.btn.mini{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn.line{background:transparent;border:1.5px dashed var(--pink);color:var(--pinkDeep)}
.btn.rec{background:var(--pinkSoft);color:var(--pinkDeep);border:1px solid #F5C9DD;animation:breathe 1.3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}

/* ---------------- 记录页 ---------------- */
.composer{padding:16px 16px 12px}
.composer .who{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.composer .who img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid #fff;
  box-shadow:0 3px 8px -4px rgba(201,89,139,.6);background:var(--pinkSoft)}
.composer .who span{font-size:12.5px;color:var(--pinkDeep);font-weight:700;letter-spacing:.04em}
.composer textarea{
  width:100%;border:none;outline:none;resize:none;font:inherit;font-size:16.5px;line-height:1.62;
  min-height:92px;color:var(--ink);background:transparent;
}
.composer textarea::placeholder{color:#CDB9C4}
.hr{height:1px;background:var(--line);margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;
  font-weight:600;color:var(--sub);cursor:pointer;user-select:none;transition:.15s;font-family:var(--font);
  display:inline-flex;align-items:center;gap:5px;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--pink);border-color:var(--pink);color:var(--rose);font-weight:800;
  box-shadow:0 6px 14px -8px rgba(224,120,168,1)}
.chip.on.g{background:var(--green);border-color:var(--green);color:#54682A}
.chip.on.b{background:var(--blue);border-color:var(--blue);color:#11526F}
.chip.on.y{background:var(--yellow);border-color:var(--yellow);color:#6F5710}
.tools{display:flex;align-items:center;gap:8px;margin-top:13px}
.tool{
  width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--pinkDeep);
  transition:.15s;flex:none;
}
.tool:active{transform:scale(.92)}
.tool.on{background:var(--pinkSoft);border-color:#F5C9DD}
.tools .sp{flex:1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.thumbs .th{position:relative;width:66px;height:66px;border-radius:14px;overflow:hidden;border:2px solid #fff;
  box-shadow:0 4px 10px -6px rgba(201,89,139,.6)}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(80,50,64,.6);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.thumbs .x svg{width:10px;height:10px;stroke-width:2.6}

/* 提示条 */
.hint{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--sub);line-height:1.55}
.hint .dotp{width:6px;height:6px;border-radius:50%;background:var(--pink);margin-top:6px;flex:none}

/* ---------------- 灵感卡片 ---------------- */
.idea-card{cursor:pointer;transition:.18s}
.idea-card:active{transform:scale(.995)}
.idea-card .top{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.idea-card .time{margin-left:auto;font-size:11px;color:#C6B4BF}
.idea-card .txt{font-size:14.5px;line-height:1.66;color:var(--ink);display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.idea-card .imgs{display:flex;gap:6px;margin-top:9px}
.idea-card .imgs img{width:58px;height:58px;border-radius:12px;object-fit:cover}
.idea-card .foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.mini-bar{height:6px;border-radius:4px;background:#F8EDF3;overflow:hidden;margin-top:10px}
.mini-bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#FAD3E5,var(--pinkMid));transition:width .4s}

/* ---------------- 空状态 ---------------- */
.empty{text-align:center;padding:34px 20px;color:var(--sub)}
.empty img{width:150px;margin:0 auto 10px;display:block;opacity:.95;mix-blend-mode:multiply}
.empty p{font-size:13px;line-height:1.7}

/* ---------------- 底部导航 ---------------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
  display:flex;gap:4px;padding:7px;border-radius:24px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid #FBE6F0;
  box-shadow:0 18px 40px -18px rgba(201,89,139,.6),0 2px 8px rgba(201,89,139,.06);
}
.tabbar button{
  position:relative;border:none;background:transparent;border-radius:18px;
  padding:8px 13px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--sub);font-family:var(--font);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  cursor:pointer;transition:.18s;min-width:60px;
}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{background:linear-gradient(160deg,#FDEBF4,#FBE0EE);color:var(--pinkDeep)}
.tabbar button.on svg{stroke-width:2}
.tabbar .dot{position:absolute;top:6px;right:12px;min-width:15px;height:15px;border-radius:8px;
  background:var(--pinkMid);color:#fff;font-size:9.5px;line-height:15px;font-weight:800;padding:0 4px;
  display:none;box-shadow:0 0 0 2px #fff}
.tabbar .dot.show{display:block}

/* ---------------- 星图 ---------------- */
.galaxy{position:relative;margin:0 -16px;padding:0}
.sky-wrap{position:relative;height:calc(100dvh - 182px);min-height:430px;overflow:hidden;border-radius:0;
  background:radial-gradient(60% 45% at 50% 48%, #FFF6E6 0%, rgba(255,246,230,0) 62%),
             radial-gradient(90% 70% at 20% 10%, #FDE9F3 0%, rgba(253,233,243,0) 60%),
             radial-gradient(90% 70% at 88% 20%, #EAF6FD 0%, rgba(234,246,253,0) 55%),
             radial-gradient(100% 80% at 50% 108%, #F3EAFB 0%, rgba(243,234,251,0) 60%),
             linear-gradient(180deg,#FFF4EE,#F7E7F1 46%,#EDE0F5 78%,#E7DCF3);
}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.sky-top{position:absolute;left:0;right:0;top:0;padding:12px 16px 0;display:flex;gap:8px;z-index:2;pointer-events:none}
.sky-top>*{pointer-events:auto}
.searchbox{flex:1;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.86);
  border:1px solid #FBE6F0;border-radius:15px;padding:8px 12px;box-shadow:0 8px 18px -14px rgba(201,89,139,.8)}
.searchbox input{border:none;outline:none;background:transparent;font:inherit;font-size:13px;flex:1;color:var(--ink)}
.searchbox svg{width:15px;height:15px;color:var(--pinkMid);flex:none}
.sky-pill{background:rgba(255,255,255,.86);border:1px solid #FBE6F0;border-radius:15px;padding:8px 11px;
  font-size:12px;font-weight:700;color:var(--pinkDeep);cursor:pointer;display:flex;align-items:center;gap:5px;
  box-shadow:0 8px 18px -14px rgba(201,89,139,.8)}
.sky-pill svg{width:15px;height:15px}
.sky-foot{position:absolute;left:14px;right:14px;bottom:10px;display:flex;align-items:center;gap:8px;z-index:2}
.sky-legend{display:flex;gap:9px;flex-wrap:wrap;font-size:10.5px;color:var(--ink2);
  background:rgba(255,255,255,.72);border-radius:12px;padding:5px 9px;border:1px solid #FBE6F0;backdrop-filter:blur(6px)}
.sky-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
.sky-tip{margin-left:auto;font-size:10.5px;color:var(--sub)}
.sky-note{position:absolute;left:14px;right:14px;bottom:44px;display:flex;gap:9px;align-items:center;z-index:2;
  background:rgba(255,255,255,.78);border:1px solid #FBE6F0;border-radius:18px;padding:8px 12px;
  backdrop-filter:blur(8px);box-shadow:0 10px 24px -20px rgba(201,89,139,.9)}
.sky-note img{width:40px;height:40px;object-fit:contain;mix-blend-mode:multiply;flex:none}
.sky-note b{display:block;font-size:12.5px;color:var(--rose);letter-spacing:.02em}
.sky-note span{display:block;font-size:10.5px;color:var(--sub);margin-top:1px}

/* ---------------- 行动页 ---------------- */
.taskrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.taskrow:last-child{border-bottom:none}
.ck{width:23px;height:23px;border-radius:9px;border:2px solid #F0D8E3;flex:none;margin-top:1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;background:#fff;transition:.16s}
.ck svg{width:13px;height:13px;stroke-width:3}
.ck.on{background:linear-gradient(150deg,#DCE9A8,var(--green));border-color:#C2D877}
.taskrow .body{flex:1;min-width:0}
.taskrow .t{font-size:14px;line-height:1.55}
.taskrow .t.done{text-decoration:line-through;color:#C9B8C1}
.taskrow .meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.taskrow .due{font-size:11px;color:var(--sub)}
.taskrow .due.over{color:#C4456B;font-weight:700}
.taskrow .from{font-size:11px;color:#C6B4BF;cursor:pointer}
.rec-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--greenDeep);
  background:var(--greenSoft);border-radius:8px;padding:1px 7px;font-weight:700}
.rec-photo{width:42px;height:42px;border-radius:11px;object-fit:cover;border:2px solid #fff;
  box-shadow:0 4px 10px -6px rgba(201,89,139,.5);flex:none}
.grouphead{display:flex;align-items:center;gap:7px;margin:16px 4px 8px;font-size:12px;font-weight:800;
  color:var(--ink2);letter-spacing:.06em}
.grouphead .n{background:#FBF1F6;color:var(--sub);border-radius:8px;padding:0 6px;font-size:10.5px}
.grouphead.warn{color:#B3456A}
.grouphead.warn .n{background:#FDE9EE;color:#B3456A}

/* ---------------- 回顾页 ---------------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border-radius:18px;border:1px solid var(--line);padding:11px 6px;text-align:center;
  box-shadow:0 8px 18px -16px rgba(201,89,139,.9)}
.stat b{display:block;font-size:21px;font-weight:800;color:var(--rose);line-height:1.2}
.stat span{font-size:10px;color:var(--sub);letter-spacing:.05em}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.wall .it{position:relative;border-radius:16px;overflow:hidden;background:var(--pinkMist);
  border:1px solid var(--line);aspect-ratio:1;cursor:pointer}
.wall .it img{width:100%;height:100%;object-fit:cover;display:block}
.wall .it .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 7px 6px;font-size:10px;color:#fff;
  background:linear-gradient(transparent,rgba(90,50,70,.72));line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wall .it.txtonly{display:flex;align-items:center;justify-content:center;padding:10px;
  background:linear-gradient(160deg,#FFF3F8,#FDF7E2)}
.wall .it.txtonly{flex-direction:column;gap:4px}
.wall .it.txtonly span{font-size:11px;color:var(--rose);line-height:1.45;text-align:center;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wall .it.txtonly em{font-style:normal;font-size:9.5px;color:#C6A2B4;letter-spacing:.06em}
.praise{display:flex;gap:12px;align-items:center}
.praise img{width:64px;flex:none;mix-blend-mode:multiply}
.praise .t{font-size:14px;font-weight:700;color:var(--rose);line-height:1.6}
.praise .s{font-size:12px;color:var(--sub);margin-top:3px}

/* ---------------- 弹层 ---------------- */
.mask{position:fixed;inset:0;background:rgba(76,45,60,.34);backdrop-filter:blur(3px);z-index:60;
  display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--cream);width:100%;max-width:660px;max-height:92vh;overflow-y:auto;
  border-radius:26px 26px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  position:relative;animation:up .26s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -12px 40px -20px rgba(120,60,90,.5);
}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:translateY(0);opacity:1}}
@media(min-width:700px){.mask{align-items:center;padding:24px}.sheet{border-radius:26px;max-height:86vh}}
.sheet .grab{width:40px;height:4px;border-radius:3px;background:#EBD8E1;margin:6px auto 12px}
.sheet h3{font-size:16.5px;font-weight:800;color:var(--rose);letter-spacing:.03em;display:flex;align-items:center;gap:7px}
.sheet .close{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;background:#fff;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer}
.sheet .close svg{width:14px;height:14px;stroke-width:2.4}
.fld{margin-top:12px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin-bottom:6px}
.fld textarea,.fld input[type=text],.fld input[type=date],.fld input[type=search]{
  width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 13px;font:inherit;font-size:14px;
  outline:none;background:#fff;color:var(--ink)}
.fld textarea:focus,.fld input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(240,173,206,.24)}
.fld textarea{min-height:74px;resize:vertical}

/* 对话 */
.chat{display:flex;flex-direction:column;gap:10px;padding:6px 0 4px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg .av{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover;border:1.5px solid #fff;
  box-shadow:0 4px 10px -6px rgba(201,89,139,.7);background:var(--pinkSoft)}
.bub{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:10px 13px;
  font-size:13.5px;line-height:1.68;color:var(--ink);box-shadow:0 8px 18px -18px rgba(201,89,139,.9);
  max-width:calc(100% - 40px)}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:linear-gradient(150deg,#FCE3EF,#FAD7E8);border-color:#F8CFE2;
  border-radius:16px 16px 5px 16px;color:var(--rose)}
.bub b{color:var(--pinkDeep)}
.bub .q{font-weight:800;color:var(--rose);display:block;margin-bottom:2px}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--pink);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.quick .chip{background:#fff}

/* 方案卡 */
.plan{background:linear-gradient(170deg,#FFFDF4,#FFF5FA);border:1px solid #FBE9D9;border-radius:18px;padding:13px;margin-top:4px}
.plan h4{font-size:13px;font-weight:800;color:var(--rose);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.plan h4 svg{width:15px;height:15px;color:var(--pinkMid)}
.plan .k{font-size:11px;font-weight:800;color:var(--pinkDeep);letter-spacing:.08em;margin:9px 0 3px}
.plan ol{list-style:none;display:flex;flex-direction:column;gap:7px}
.plan ol li{display:flex;gap:8px;font-size:12.8px;line-height:1.6;color:var(--ink2)}
.plan ol li .idx{width:18px;height:18px;border-radius:6px;background:#fff;border:1px solid #F6DDE9;
  color:var(--pinkDeep);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.plan ol li .min{color:var(--sub);font-size:11px;margin-left:4px;white-space:nowrap}
.plan p{font-size:12.8px;color:var(--ink2);line-height:1.7}

/* 详情 */
.detail .dtext{font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.detail .mrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.detail .dimg{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.detail .dimg img{width:76px;height:76px;border-radius:14px;object-fit:cover}
.encourage{background:linear-gradient(150deg,#FFF3F9,#FFF9E6);border:1px dashed #F3C8DA;border-radius:18px;
  padding:12px 13px;margin-top:12px;font-size:13.5px;line-height:1.7;color:var(--rose);position:relative}
.encourage .lab{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--pinkDeep);opacity:.8;margin-bottom:3px}
.tlist{margin-top:4px}
.tline{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.tline:last-child{border-bottom:none}
.tline .t{flex:1;font-size:13.5px;line-height:1.55}
.tline .t.done{text-decoration:line-through;color:#C9B8C1}
.tline .x{color:#DCC9D3;cursor:pointer;flex:none;padding:2px}
.tline .x svg{width:14px;height:14px}
.rowbtn{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.rowbtn .btn{flex:1;min-width:110px}

/* 打卡 */
.moods{display:flex;gap:7px;flex-wrap:wrap}
.mood{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 11px;font-size:12.5px;
  font-weight:700;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font)}
.mood svg{width:17px;height:17px}
.mood.on{background:var(--yellowSoft);border-color:#F3E3A6;color:var(--yellowDeep)}
.uploader{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.up-add{width:66px;height:66px;border-radius:14px;border:1.5px dashed #F0C9DB;background:#FFFBFD;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  color:var(--pinkMid);font-size:10px;font-weight:700}
.uploader{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.uploader .th{position:relative;width:66px;height:66px;border-radius:14px;overflow:hidden;border:2px solid #fff;
  box-shadow:0 4px 10px -6px rgba(201,89,139,.6)}
.uploader .th img{width:100%;height:100%;object-fit:cover;display:block}
.uploader .th .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(80,50,64,.6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.uploader .th .x svg{width:10px;height:10px;stroke-width:2.6}

/* 设置 */
.setrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .t{flex:1}
.setrow .t b{display:block;font-size:14px;font-weight:700}
.setrow .t span{font-size:11.5px;color:var(--sub)}
.switch{width:46px;height:27px;border-radius:14px;background:#EFE3EA;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(120,60,90,.25);transition:.2s}
.switch.on{background:var(--pink)}
.switch.on i{left:22px}
pre.code{background:#FFFBF4;border:1px dashed #F0DCC9;border-radius:14px;padding:10px;font-size:10.5px;
  white-space:pre-wrap;word-break:break-all;max-height:130px;overflow:auto;font-family:ui-monospace,Consolas,monospace;
  color:var(--ink2);margin-top:8px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:rgba(94,54,74,.94);color:#FFF3F8;padding:10px 18px;border-radius:16px;font-size:13px;
  font-weight:600;opacity:0;pointer-events:none;transition:.26s;z-index:99;max-width:86vw;text-align:center;
  box-shadow:0 16px 30px -18px rgba(80,30,55,.9)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 小工具类 */
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.tc{text-align:center}
.dim{color:var(--sub);font-size:12px}
.flexrow{display:flex;align-items:center;gap:8px}
.grow{flex:1}

</style>
</head>

/* ---------------- 存储：IndexedDB，失败降级 localStorage ---------------- */
const DB_NAME='starbox', STORE='ideas', LSKEY='starbox_v2';
let db=null, LS=false;
const lsAll=()=>{try{return JSON.parse(localStorage.getItem(LSKEY)||'[]')}catch(e){return[]}};
const lsSave=a=>{try{localStorage.setItem(LSKEY,JSON.stringify(a))}catch(e){toast('本地空间满了，删点图片吧')}};

function openDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){LS=true;return res()}
    let q;
    try{q=indexedDB.open(DB_NAME,1)}catch(e){LS=true;return res()}
    q.onupgradeneeded=e=>{const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};
    q.onsuccess=e=>{db=e.target.result;res()};
    q.onerror=()=>{LS=true;res()};
    q.onblocked=()=>{LS=true;res()};
    setTimeout(()=>{if(!db){LS=true;res()}},2500);
  });
}
function allIdeas(){
  if(LS||!db)return Promise.resolve(lsAll());
  return new Promise(res=>{
    try{
      const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();
      r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res(lsAll());
    }catch(e){res(lsAll())}
  });
}
function putIdea(o){
  if(LS||!db){const a=lsAll(),i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;lsSave(a);return Promise.resolve()}
  return new Promise(res=>{
    try{
      const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(o);
      t.oncomplete=res;t.onerror=()=>{LS=true;const a=lsAll(),i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;lsSave(a);res()};
    }catch(e){LS=true;res()}
  });
}
function delIdea(id){
  if(LS||!db){lsSave(lsAll().filter(x=>x.id!==id));return Promise.resolve()}
  return new Promise(res=>{
    try{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=res}
    catch(e){res()}
  });
}

/* ---------------- 小工具 ---------------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ic=(n,cls='')=>`<svg class="ic ${cls}"><use href="#${n}"/></svg>`;

let toastT=null;
function toast(m){
  const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2100);
}
function fmtT(ts){
  const d=new Date(ts),n=new Date(),p=x=>String(x).padStart(2,'0');
  const hm=p(d.getHours())+':'+p(d.getMinutes());
  if(d.toDateString()===n.toDateString())return '今天 '+hm;
  const y=new Date(n.getTime()-864e5);
  if(d.toDateString()===y.toDateString())return '昨天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
const daysAgo=ts=>(Date.now()-ts)/864e5;
const dstr=d=>{const p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
function dueLabel(due){
  if(!due)return '';
  const t=new Date(due+'T23:59:59'),n=new Date();
  const d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),d1=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const diff=Math.round((d1-d0)/864e5);
  if(diff<0)return '已过期 '+(-diff)+' 天';
  if(diff===0)return '今天到期';
  if(diff===1)return '明天到期';
  if(diff<=7)return diff+' 天后到期';
  return due.slice(5).replace('-','/')+' 到期';
}
const isOver=due=>!!due&&new Date(due+'T23:59:59')<new Date();

/* ---------------- 常量 ---------------- */
const TYPES={
  idea:{n:'点子',cls:'idea'},
  todo:{n:'待办',cls:'todo'},
  goal:{n:'目标',cls:'goal'}
};
const URG=[{n:'不急'},{n:'一般'},{n:'有点急'}];

let IDEAS=[], CUR='cap', Q='', FTYPE='all';
const DRAFT={text:'',imgs:[],type:'idea',urg:1,tags:[]};
const SCROLL={cap:0,galaxy:0,act:0,rev:0};

/* ---------------- 渲染框架 ---------------- */
function render(keepScroll){
  const v=$('#view');
  if(!keepScroll)SCROLL[CUR]=0;
  v.innerHTML=RENDER[CUR]();
  if(CUR==='galaxy')initSky();
  const b=$('#actDot');
  const n=allTasks().filter(t=>!t.done&&isOver(t.due)).length;
  b.textContent=n>3?'3+':n;b.classList.toggle('show',n>0);
}
function refresh(keep){render(keep!==false)}
function go(tab){
  if(tab===CUR){SCROLL[tab]=0;render();return}
  CUR=tab;SCROLL[tab]=0;
  $$('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  render();
  window.scrollTo({top:0,behavior:'auto'});
}

function compress(file,maxW=1000,q=.78){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        let w=im.width,h=im.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);
        x.drawImage(im,0,0,w,h);
        res(c.toDataURL('image/jpeg',q));
      };
      im.onerror=()=>res(null);
      im.src=fr.result;
    };
    fr.onerror=()=>res(null);
    fr.readAsDataURL(file);
  });
}

let MIC=null,RECING=false;
function toggleRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('这个浏览器不支持语音，试试 Chrome / Edge');return}
  if(RECING){try{MIC.stop()}catch(e){}RECING=false;refresh();return}
  MIC=new SR();MIC.lang='zh-CN';MIC.continuous=true;MIC.interimResults=true;
  const base=DRAFT.text;
  MIC.onresult=e=>{
    let s='';
    for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;
    DRAFT.text=(base?s+' ':'')+s;
    const ta=$('#capText');if(ta)ta.value=DRAFT.text;
  };
  MIC.onerror=()=>{RECING=false;refresh();toast('没听清，再说一次？')};
  MIC.onend=()=>{RECING=false;refresh()};
  try{MIC.start();RECING=true;refresh();toast('在听，说完再点一次')}
  catch(e){toast('语音启动失败')}
}

function domainOf(text){
  for(const d of DOMAINS){if(d.k.test(text||'')&&d.name!=='通用')return d}
  return DOMAINS[DOMAINS.length-1];
}
function horizonInfo(h){
  return {week:{days:7,label:'一周之内',pace:'每天挤 20 分钟'},
          month:{days:30,label:'这个月内',pace:'每周推进两三步'},
          quarter:{days:90,label:'三个月内',pace:'每周一步，稳稳走'},
          slow:{days:45,label:'不着急，慢慢来',pace:'想起来就推一点'}}[h]||{days:30,label:'这个月内',pace:'每周推进两三步'};
}
const BLOCKS={
  start:{label:'不知道从哪开始',tip:'所以第一步我给你压到了 10 分钟——不用想全局，只做那一件。'},
  time:{label:'时间不够',tip:'我把每一步都缩短了，单步不超过 25 分钟，塞在通勤或睡前都能做。'},
  resource:{label:'缺资源',tip:'所以第一版全都用你手上已经有的东西做，缺的写进「需要准备」，别等。'},
  quit:{label:'容易半途放弃',tip:'所以步骤只有五步，每完成一步就来打个卡，攒着的记录会替你坚持。'}
};
const RHYTHM={daily:'每天一点点',weekend:'周末集中做',random:'想到就做'};

function buildPlan(o,ans){
  const d=domainOf(o.text);
  const hi=horizonInfo(ans.horizon);
  const block=ans.block||'start';
  let steps=d.steps.map(s=>({t:s[0],min:s[1]}));
  if(block==='time')steps=steps.map(s=>({t:s.t,min:Math.max(5,Math.round(s.min*.6))}));
  if(block==='quit')steps=steps.slice(0,4);
  if(block==='start')steps=steps.slice(0,4);
  // 把节奏揉进第一步
  if(ans.rhythm==='daily')steps[0].t=steps[0].t+'（今天就做，只做这一步）';
  if(ans.rhythm==='weekend')steps[0].t=steps[0].t+'（这周末留出半小时）';
  // 分摊日期
  const total=steps.reduce((a,b)=>a+b.min,0);
  let acc=0;
  const tasks=steps.map((s,i)=>{
    acc+=s.min;
    let day=Math.round(acc/total*hi.days);
    day=clamp(day,i===0?0:1,hi.days);
    return {id:uid(),t:s.t,min:s.min,due:addDays(day),done:false,rec:null};
  });
  return {
    goal:`${hi.label}，把「${shortOf(o.text,18)}」做成一件看得见结果的事`,
    domain:d.name,
    horizon:hi.label,pace:hi.pace,block:BLOCKS[block].label,rhythm:RHYTHM[ans.rhythm||'daily'],
    steps:tasks.map((t,i)=>({i:i+1,t:t.t,min:t.min,due:t.due})),
    res:d.res.slice(),risk:d.risk.slice(),
    tip:BLOCKS[block].tip,
    created:Date.now()
  };
}
function shortOf(s,n){s=(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s}

/* 生成后的小结文案 */
function planIntro(o,p){
  return `好，「${shortOf(o.text,14)}」这件事，我按 <b>${p.domain}</b> 的路子拆成了 ${p.steps.length} 步，`+
         `总共大约 ${p.steps.reduce((a,b)=>a+b.min,0)} 分钟，摊在<b>${p.horizon}</b>。`;
}
function planOutro(o,p){
  const first=p.steps[0];
  const pool=[
    `第一步只有 ${first.min} 分钟，比刷一会儿手机还短。开始了就不算迟。`,
    `不用一次走完，${p.pace}就好。你已经比停在念头里的人靠前了。`,
    `我把它放进待办了，完成一步就来打个卡——那些记录会替你记得你有多能扛。`,
    `慢慢来，比较快。第一颗星已经亮了。`
  ];
  return pool[Math.floor(o.seed)%pool.length];
}
function encourageFor(o){
  const p=[
    `「${shortOf(o.text,12)}」这件事，你已经在做了，只是还没做完。`,
    `不用等状态好，先做最小那一步，状态会跟上来。`,
    `今天做一点，明天就不会那么难开口。`,
    `你不需要很厉害才开始，是开始了才会变厉害。`,
    `星星不是一下子亮的，是一点一点攒出来的。`

  return p[Math.floor((o.seed||1))%p.length];
}

function parseHorizon(t){
  if(/7|七|一周|1周|星期|几天|尽快|马上|这周|下周/.test(t))return 'week';
  if(/三个|3个|季度|90|三月/.test(t))return 'quarter';
  if(/不着急|不急|慢|随缘|半年/.test(t))return 'slow';
  return 'month';
}
function parseBlock(t){
  if(/不知道|从哪|头绪|迷茫|无从/.test(t))return 'start';
  if(/时间|忙|没空|抽不出|加班/.test(t))return 'time';
  if(/资源|工具|钱|人|设备|条件|材料/.test(t))return 'resource';
  if(/放弃|坚持|半途|懒|拖延|自律|三分钟/.test(t))return 'quit';
  return 'start';
}
function parseRhythm(t){
  if(/每天|每日|一点点|天天/.test(t))return 'daily';
  if(/周末|集中|一次做完/.test(t))return 'weekend';
  return 'random';
}

function handleAnswer(raw){
  const o=IDEAS.find(x=>x.id===CHAT.id);
  if(!o)return;
  const step=CHAT.step;
  if(step===0){
    CHAT.ans.horizon=parseHorizon(raw);CHAT.step=1;
    typingThen(()=>{
      botMsg(`记下了，<b>${horizonInfo(CHAT.ans.horizon).label}</b>。`);
      botMsg(Q2.q,[...Q2.chips],'q2');
      repaintChat();
    });
    return;
  }
  if(step===1){
    CHAT.ans.block=parseBlock(raw);CHAT.step=2;
    typingThen(()=>{
      botMsg(`明白，<b>${BLOCKS[CHAT.ans.block].label}</b>——这个我按经验处理过，等下你会看到我怎么拆。`);
      botMsg(Q3.q,[...Q3.chips],'q3');
      repaintChat();
    });
    return;
  }
  if(step===2){
    CHAT.ans.rhythm=parseRhythm(raw);CHAT.step=3;
    typingThen(()=>{
      const p=buildPlan(o,CHAT.ans);
      o.plan=p;o.ans=CHAT.ans;o.encourage=encourageFor(o);
      // 自动生成待办
      o.tasks=p.steps.map(s=>({id:uid(),t:s.t,min:s.min,due:s.due,done:false,rec:null}));
      o.updated=Date.now();
      botMsg(`${planIntro(o,p)}`);
      CHAT.msgs.push({r:'bot',t:'',plan:p});
      botMsg(planOutro(o,p));
      botMsg('已经把这 '+p.steps.length+' 步放进「行动」了。哪一步觉得不合适，直接告诉我。',
              ['第一步再简单点','时间有点紧','就这样，开始吧'],'done');
      repaintChat();
      putIdea(o);
      refresh();
    },760);
    return;
  }
  // 方案之后的自由沟通
  const t=raw;
  typingThen(()=>{
    if(/简单|难|轻松|压|少一点|太长/.test(t)){
      o.tasks.forEach(x=>x.min=Math.max(5,Math.round((x.min||15)*.6)));
      if(o.plan)o.plan.steps.forEach((s,i)=>{s.min=o.tasks[i]?o.tasks[i].min:s.min});
      botMsg('那我把它再压一压——每一步都比刚才短，先让身体动起来，成就感会推着你走。');
      o.updated=Date.now();
    }else if(/时间|紧|来不及|推迟|晚点/.test(t)){
      o.tasks.forEach(x=>{if(x.due){const d=new Date(x.due+'T12:00');d.setDate(d.getDate()+7);x.due=dstr(d)}});
      botMsg('都往后挪了一周。慢一点没关系，别让日期把你压回去。');
      o.updated=Date.now();
    }else if(/加|多一步|再来/.test(t)){
      o.tasks.push({id:uid(),t:'补一步：写三句话，记录这次做到的和没做到的',min:10,due:addDays(10),done:false,rec:null});
      botMsg('补了一步复盘。做完记得回来写那三句话，它比做完本身更值钱。');
      o.updated=Date.now();
    }else if(/删|去掉|不要了/.test(t)){
      const r=o.tasks.pop();
      botMsg(r?`删掉了「${esc(shortOf(r.t,12))}」，剩下的更轻了。`:'已经没有可删的步骤了。');
      o.updated=Date.now();
    }else if(/好的|可以|行|开始|谢谢|就这样|明白/.test(t)){
      botMsg(`那就从第一步开始吧。我在这里等着你的打卡记录。`);
      botMsg(encourageFor(o));
    }else{
      botMsg('我把这句话记在这条灵感下面了。要不要我按刚才的计划再调整某一步？',
             ['第一步再简单点','加一步复盘','就这样，开始吧']);
    }
    putIdea(o);refresh();repaintChat();
  },560);
}

/* ============================================================
   星图
   ============================================================ */
const SKY={cv:null,ctx:null,w:0,h:0,dpr:1,nodes:[],dust:[],raf:0,t0:0,filter:'',ro:null};
const STAR_COLOR={idea:'#F0ADCE',todo:'#C8DC7D',goal:'#6CC8F1'};
const STAR_DEEP={idea:'#C9598B',todo:'#7A9033',goal:'#2E7FA6'};
let GIRL=new Image();GIRL.src=IMG.girl;
let SOFT=new Image();SOFT.src=IMG.soft;

        </div>

      </div>

        <div><b>${line}</b><span>想得越久，星图越大；做得越多，星星越亮。</span></div>
      </div>

          <span><i style="background:#C8DC7D"></i>待办</span>

        </div>

function skyTargetH(){
  const wrap=$('#skyWrap');if(!wrap)return 0;
  const top=wrap.getBoundingClientRect().top+window.scrollY;
  const tb=document.querySelector('.tabbar');
  const reserve=(tb?tb.offsetHeight+22:84);   /* tabbar 实际高度 + 底部留白 + 呼吸间距 */
  return Math.max(360,Math.round(window.innerHeight-top-reserve));
}
function fitSky(){
  const wrap=$('#skyWrap');if(!wrap)return;
  wrap.style.transition='none';   /* 尺寸必须瞬时生效，否则会被过渡动画卡住旧值 */
  wrap.style.minHeight='0';
  wrap.style.height=skyTargetH()+'px';
}
function initSky(){
  const cv=$('#sky');if(!cv)return;
  SKY.cv=cv;SKY.ctx=cv.getContext('2d');
  fitSky();
  resizeSky();
  buildNodes();
  SKY.t0=performance.now();
  if(SKY.ro)SKY.ro.disconnect();
  SKY.ro=new ResizeObserver(()=>{resizeSky()});
  SKY.ro.observe($('#skyWrap'));
  cv.onclick=skyClick;
  cancelAnimationFrame(SKY.raf);
  SKY.raf=requestAnimationFrame(skyLoop);
  /* 视口高度可能在首屏后才稳定（移动端地址栏 / 无头截图 / 软键盘），补一次校准 */
  requestAnimationFrame(()=>{fitSky();resizeSky()});
  setTimeout(()=>{if(CUR==='galaxy'){fitSky();resizeSky()}},260);
}
function resizeSky(){
  const cv=SKY.cv;if(!cv)return;
  const r=cv.parentElement.getBoundingClientRect();
  SKY.dpr=Math.min(window.devicePixelRatio||1,2);
  SKY.w=r.width;SKY.h=r.height;
  cv.width=Math.round(r.width*SKY.dpr);cv.height=Math.round(r.height*SKY.dpr);
  SKY.ctx.setTransform(SKY.dpr,0,0,SKY.dpr,0,0);
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}

function buildNodes(){
  const list=IDEAS.slice().sort((a,b)=>a.created-b.created);
  const N=Math.max(list.length,1);
  SKY.nodes=list.map((o,i)=>{
    const hh=hash(o.id);
    const base=0.15+0.76*Math.sqrt((i+0.7)/(N+0.7))+(hh%13)/900;
    return {
      o,i,
      a:(i*2.39996)+(hh%100)/160,
      base,
      size:o.status==='done'?11:(o.urg===2?10.2:(o.urg===1?9.4:8.4)),
      color:o.status==='done'?'#F6E281':(STAR_COLOR[o.type]||'#F0ADCE'),
      deep:o.status==='done'?'#B08A1E':(STAR_DEEP[o.type]||'#C9598B'),
      speed:0.5+(hh%40)/40,
      x:0,y:0,r:0
    };
  });
  SKY.dust=Array.from({length:120},(_,i)=>{
    const hh=(i*2654435761)%1000;
    return {a:(hh/1000)*Math.PI*2,r:0.12+(hh%97)/100,s:0.35+((hh%30)/30),z:0.35+((hh%60)/60)};
  });
}
function skySearch(v){
  SKY.filter=(v||'').trim().toLowerCase();
  const tip=document.querySelector('.sky-tip');
  if(tip&&SKY.filter){
    const n=SKY.nodes.filter(n=>(n.o.text||'').toLowerCase().includes(SKY.filter)||(n.o.tags||[]).join(' ').toLowerCase().includes(SKY.filter)).length;
    tip.textContent='命中 '+n+' 颗';
  }else if(tip){tip.textContent=IDEAS.length+' 颗 · 点星星看细节'}
}

function sparklePath(ctx,x,y,r){
  const k=r*0.15;
  ctx.beginPath();
  ctx.moveTo(x,y-r);
  ctx.quadraticCurveTo(x+k,y-k,x+r,y);
  ctx.quadraticCurveTo(x+k,y+k,x,y+r);
  ctx.quadraticCurveTo(x-k,y+k,x-r,y);
  ctx.quadraticCurveTo(x-k,y-k,x,y-r);
  ctx.closePath();
}
function hex2rgba(h,a){
  const n=parseInt(h.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function skyLoop(ts){
  if(CUR!=='galaxy'){SKY.raf=0;return}
  const ctx=SKY.ctx;if(!ctx){SKY.raf=0;return}
  /* 低频自校准：视口变化若无 resize 事件（移动端地址栏 / 内嵌 webview / 无头截图），也能贴合 */
  SKY.tick=(SKY.tick||0)+1;
  if(SKY.tick%40===0){
    const wrap=$('#skyWrap');
    if(wrap&&Math.abs(wrap.offsetHeight-skyTargetH())>8){fitSky();resizeSky()}
  }
  const W=SKY.w,H=SKY.h,cx=W/2,cy=H/2;
  const t=(ts-SKY.t0)/1000;
  ctx.clearRect(0,0,W,H);

  const RX=W*0.445, RY=H*0.415;
  const filter=SKY.filter;

  // 星尘
  SKY.dust.forEach((d,i)=>{
    const a=d.a+t*0.004*d.s;
    const rr=(d.r+t*0.004*d.z)%0.52;
    const x=cx+Math.cos(a)*rr*W*0.72;
    const y=cy+Math.sin(a)*rr*H*0.72;
    ctx.beginPath();
    ctx.arc(x,y,d.z*1.5,0,7);
    ctx.fillStyle=`rgba(201,89,139,${0.05+0.06*(1-rr/0.52)})`;
    ctx.fill();
  });

  // 轨道环（很淡，暗示扩散）
  ctx.save();
  for(let k=1;k<=3;k++){
    ctx.beginPath();
    ctx.ellipse(cx,cy,RX*k*0.34,RY*k*0.34,0,0,7);
    ctx.setLineDash([2,7]);
    ctx.strokeStyle='rgba(201,89,139,.10)';
    ctx.lineWidth=1;ctx.stroke();
  }
  ctx.restore();

  // 中心光晕
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(RX,RY)*0.8);
  g.addColorStop(0,'rgba(255,240,246,.92)');
  g.addColorStop(.45,'rgba(255,247,224,.42)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // 位置
  const age=1;
  SKY.nodes.forEach(n=>{
    const grow=1+0.006*Math.min(daysAgo(n.o.created),60);
    const r=Math.min(n.base*grow,0.99);
    const a=n.a+Math.sin(t*0.12+n.speed)*0.016;
    n.r=r;n.x=cx+Math.cos(a)*r*RX;n.y=cy+Math.sin(a)*r*RY;
    n.tw=0.7+0.3*Math.sin(t*n.speed*1.5+n.a*3);
  });

  // 关联连线（同标签 / 文字相近）
  if(SKY.nodes.length>1&&SKY.nodes.length<60){
    for(let i=0;i<SKY.nodes.length;i++){
      for(let j=i+1;j<SKY.nodes.length;j++){
        const A=SKY.nodes[i],B=SKY.nodes[j];
        const shared=(A.o.tags||[]).filter(t=>(B.o.tags||[]).includes(t)).length;
        const near=Math.hypot(A.x-B.x,A.y-B.y)<Math.min(RX,RY)*0.55;
        if(shared>0&&near){
          ctx.beginPath();ctx.moveTo(A.x,A.y);
          ctx.quadraticCurveTo((A.x+B.x)/2,(A.y+B.y)/2-14,B.x,B.y);
          ctx.strokeStyle='rgba(240,173,206,.32)';ctx.lineWidth=1;
          ctx.setLineDash([3,5]);ctx.stroke();ctx.setLineDash([]);
        }
      }
    }
  }

  // 星星
  const cr0=Math.min(W,H)*0.105;
  const labels=[{x:cx-46,y:cy+cr0+5,w:92,h:16}];
  SKY.nodes.forEach(n=>{
    const match=!filter||(n.o.text||'').toLowerCase().includes(filter)||(n.o.tags||[]).join(' ').toLowerCase().includes(filter);
    const alpha=match?1:0.16;
    const R=n.size*(1+(n.o.status==='done'?0.28:0))*(0.92+0.14*n.tw);
    // 光晕
    const glow=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,R*4.2);
    glow.addColorStop(0,hex2rgba(n.color,.55*alpha));
    glow.addColorStop(.4,hex2rgba(n.color,.18*alpha));
    glow.addColorStop(1,hex2rgba(n.color,0));
    ctx.fillStyle=glow;
    ctx.beginPath();ctx.arc(n.x,n.y,R*4.2,0,7);ctx.fill();
    // 星形（深色本体 + 浅色描边，保证在浅色天空里看得见）
    sparklePath(ctx,n.x,n.y,R);
    ctx.fillStyle=hex2rgba(n.deep,0.9*alpha);
    ctx.fill();
    ctx.lineWidth=2.2;ctx.strokeStyle=hex2rgba('#ffffff',0.85*alpha);ctx.stroke();
    // 内核
    ctx.beginPath();ctx.arc(n.x,n.y,R*0.2,0,7);
    ctx.fillStyle=`rgba(255,255,255,${0.9*alpha})`;ctx.fill();
    // 标签
    const showLabel=(SKY.nodes.length<=16||R>8||filter);
    if(showLabel&&match){
      const label=shortOf(n.o.text.replace(/\s+/g,' '),SKY.nodes.length<=12?10:7);
      ctx.font='700 11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      const w=ctx.measureText(label).width;
      const tx=clamp(n.x,w/2+10,W-w/2-10);
      const lx=tx-w/2-4,ly=n.y+R+4,lw=w+8,lh=15;
      const hit=labels.some(l=>!(lx>l.x+l.w||lx+lw<l.x||ly>l.y+l.h||ly+lh<l.y));
      if(!hit){
        labels.push({x:lx,y:ly,w:lw,h:lh});
        ctx.textAlign='center';ctx.textBaseline='top';
        ctx.lineWidth=3.4;ctx.strokeStyle='rgba(255,255,255,.95)';
        ctx.strokeText(label,tx,n.y+R+5);
        ctx.fillStyle=hex2rgba(n.deep,.95);
        ctx.fillText(label,tx,n.y+R+5);
      }
    }
  });

  // 中心：做梦的人
  const cr=Math.min(W,H)*0.105;
  if(GIRL.complete&&GIRL.naturalWidth){
    ctx.save();
    ctx.beginPath();ctx.arc(cx,cy,cr,0,7);ctx.closePath();ctx.clip();
    ctx.drawImage(GIRL,cx-cr,cy-cr*1.06,cr*2,cr*2*0.95);
    ctx.fillStyle='rgba(255,247,251,.42)';ctx.fillRect(cx-cr,cy-cr,cr*2,cr*2);
    ctx.fillStyle='rgba(240,173,206,.16)';ctx.fillRect(cx-cr,cy-cr,cr*2,cr*2);
    ctx.restore();
    ctx.beginPath();ctx.arc(cx,cy,cr,0,7);
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,cr+5,0,7);
    ctx.strokeStyle='rgba(240,173,206,.5)';ctx.lineWidth=1;ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(cx,cy,cr,0,7);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fill();
  }
  ctx.font='700 10px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='rgba(126,59,91,.55)';
  ctx.fillText('我在这里',cx,cy+cr+7);

  SKY.raf=requestAnimationFrame(skyLoop);
}

function skyClick(e){
  const rect=SKY.cv.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  let best=null,bd=1e9;
  SKY.nodes.forEach(n=>{
    const d=Math.hypot(n.x-x,n.y-y);
    if(d<Math.max(26,n.size*2.6)&&d<bd){bd=d;best=n}
  });
  if(best)openIdea(best.o.id);
}

  const soon=open.filter(x=>x.t.due&&!isOver(x.t.due)&&x.t.due>dstr(new Date())&&x.t.due<=addDays(7));

function genCode(){
  const slim=IDEAS.map(o=>({...o,imgs:[],tasks:(o.tasks||[]).map(t=>({...t,rec:t.rec?{ts:t.rec.ts,note:t.rec.note,imgs:[],mood:t.rec.mood}:null}))}));
  const code='SBX1.'+btoa(unescape(encodeURIComponent(JSON.stringify(slim))));
  const pre=$('#syncCode');pre.style.display='block';pre.textContent=code;
  navigator.clipboard&&navigator.clipboard.writeText(code).then(()=>toast('同步码已复制'),()=>{});
}
function impCode(){
  const t=($('#impText')||{}).value||'';
  if(!t.trim().startsWith('SBX1.')){toast('这段不是同步码');return}
  try{
    const arr=JSON.parse(decodeURIComponent(escape(atob(t.trim().slice(5)))));
    mergeIdeas(arr).then(()=>{closeSheet();toast('导入完成')});
  }catch(e){toast('解析失败，检查是否复制完整')}
}
function expFile(){
  const blob=new Blob([JSON.stringify(IDEAS,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='灵感星盒备份_'+dstr(new Date())+'.json';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function impFile(inp){
  const f=inp.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const arr=JSON.parse(fr.result);
      if(!Array.isArray(arr))throw 0;
      await mergeIdeas(arr);closeSheet();toast('已导入 '+arr.length+' 条');
    }catch(e){toast('文件读不出来')}
  };
  fr.readAsText(f);
}
async function mergeIdeas(arr){
  for(const o of arr){
    if(!o.id)o.id=uid();
    o.tasks=o.tasks||[];o.imgs=o.imgs||[];o.tags=o.tags||[];
    const i=IDEAS.findIndex(x=>x.id===o.id);
    if(i>=0)IDEAS[i]=o;else IDEAS.push(o);
    await putIdea(o);
  }
  refresh();
}
function wipe(){
  if(!confirm('清空全部灵感和打卡记录？建议先导出备份。'))return;
  IDEAS.forEach(o=>delIdea(o.id));
  IDEAS=[];
  if(LS)lsSave([]);
  closeSheet();refresh();toast('已清空');
}

  if(PICK_TARGET==='rec')REC.note=($('#recNote')||{}).value||REC.note;
  for(const f of files){
    const d=await compress(f, PICK_TARGET==='rec'?900:1000, .78);
    if(!d)continue;
    if(PICK_TARGET==='rec'){REC.imgs.push(d);openSheet(recordHTML())}
    else{DRAFT.imgs.push(d);refresh()}
  }
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#mask').classList.contains('show'))closeSheet();
});
window.addEventListener('resize',()=>{if(CUR==='galaxy'){fitSky();resizeSky()}});

(async function init(){
  await openDB();
  IDEAS=await allIdeas();
  IDEAS.sort((a,b)=>a.created-b.created);
  render();
  window.__READY=true;
  setTimeout(notifyStale,900);
})();

</script>
</body>
</html>
